openapi: 3.1.0
info:
  contact: {}
  description: "Authentication, OAuth, API keys, and partner/merchant onboarding endpoints\
    \ exposed via the gateway."
  license:
    name: Proprietary
  title: Zipper Auth API
  version: v1
servers:
- description: Gateway base URL
  url: http://localhost:8080
tags:
- description: Manage merchants onboarded by the authenticated partner
  name: Partner Merchants
- description: OAuth2 token introspection (RFC 7662)
  name: OAuth2
- description: Manage merchant API keys for OAuth2 client credentials authentication
  name: Merchant API Keys
- description: OAuth2 client credentials token endpoint
  name: OAuth2
paths:
  /auth/partners/merchants/{merchantId}:
    get:
      description: Returns the full profile of one of the authenticated partner's
        merchants. Returns 404 if the merchant does not belong to this partner.
      operationId: getPartnerMerchant
      parameters:
      - explode: false
        in: path
        name: merchantId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MerchantDetail'
          description: OK
      security:
      - bearerAuth: []
      summary: Get merchant detail
      tags:
      - Partner Merchants
      x-accepts:
      - '*/*'
    put:
      description: Updates editable profile fields of one of the partner's merchants.
        Null fields are left unchanged. Account email and status are not editable
        here.
      operationId: updatePartnerMerchant
      parameters:
      - explode: false
        in: path
        name: merchantId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantUpdateRequest'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MerchantDetail'
          description: OK
      security:
      - bearerAuth: []
      summary: Update merchant profile
      tags:
      - Partner Merchants
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /auth/partners/merchants:
    get:
      description: "Returns a paginated list of all merchants onboarded by the authenticated\
        \ partner, including their business name, email, status, and onboarding origin."
      operationId: listPartnerMerchants
      parameters:
      - explode: true
        in: query
        name: pageable
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
        style: form
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MerchantSummary'
          description: Merchants retrieved successfully
        "401":
          description: Unauthorized
        "404":
          description: Partner not found
      security:
      - bearerAuth: []
      summary: List partner merchants
      tags:
      - Partner Merchants
      x-accepts:
      - '*/*'
    post:
      description: Creates and onboards a new merchant under the authenticated partner.
        The merchant will receive an activation email to complete registration.
      operationId: partnerOnboardMerchant
      parameters:
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantOnboardingRequest'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PartnerOnboardingResult'
          description: Merchant onboarded successfully
        "400":
          description: Invalid request body
        "401":
          description: Unauthorized
        "404":
          description: Partner not found
      security:
      - bearerAuth: []
      summary: Onboard a new merchant
      tags:
      - Partner Merchants
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /auth/partners/merchants/{merchantId}/suspend:
    post:
      description: Sets the merchant's account status to SUSPENDED. Partner-scoped
        (404 if not owned).
      operationId: suspendPartnerMerchant
      parameters:
      - explode: false
        in: path
        name: merchantId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MerchantDetail'
          description: OK
      security:
      - bearerAuth: []
      summary: Suspend merchant
      tags:
      - Partner Merchants
      x-accepts:
      - '*/*'
  /auth/partners/merchants/{merchantId}/activate:
    post:
      description: Sets the merchant's account status to ACTIVE. Partner-scoped (404
        if not owned).
      operationId: activatePartnerMerchant
      parameters:
      - explode: false
        in: path
        name: merchantId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MerchantDetail'
          description: OK
      security:
      - bearerAuth: []
      summary: Activate merchant
      tags:
      - Partner Merchants
      x-accepts:
      - '*/*'
  /auth/partners/merchants/search:
    post:
      description: "Advanced search over the authenticated partner's merchants with\
        \ full-text query, filters, sorting, and pagination. Partner scope is enforced\
        \ server-side."
      operationId: searchPartnerMerchants
      parameters:
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchMerchantsRequest'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseListMerchantSummary'
          description: OK
      security:
      - bearerAuth: []
      summary: Search partner merchants
      tags:
      - Partner Merchants
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /auth/partners/merchants/bulk/status:
    post:
      description: Applies an activate/suspend action to a set of the partner's merchants.
        Ids not owned by the partner are silently skipped.
      operationId: bulkSetPartnerMerchantStatus
      parameters:
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantBulkStatusRequest'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MerchantBulkStatusResult'
          description: OK
      security:
      - bearerAuth: []
      summary: Bulk merchant status change
      tags:
      - Partner Merchants
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /oauth/token:
    post:
      description: Issues a JWT access token in exchange for valid API client credentials
        using the client_credentials grant type. Credentials must be provided via
        HTTP Basic Authentication (Base64-encoded apiKey:apiSecret).
      operationId: token
      parameters:
      - description: Basic Authentication header (Base64-encoded apiKey:apiSecret)
        explode: false
        in: header
        name: Authorization
        required: true
        schema:
          type: string
        style: simple
      - description: OAuth2 grant type (must be 'client_credentials')
        explode: true
        in: query
        name: grant_type
        required: true
        schema:
          type: string
        style: form
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Access token issued successfully
        "400":
          description: Unsupported grant type
        "401":
          description: Invalid client credentials
        "500":
          description: Internal server error
      security:
      - basicAuth: []
      summary: Exchange client credentials for an access token
      tags:
      - OAuth2
      x-accepts:
      - '*/*'
  /oauth/introspect:
    post:
      description: Returns whether the supplied token is currently active. Implements
        RFC 7662. Caller must authenticate with HTTP Basic using API client credentials
        (Base64-encoded apiKey:apiSecret).
      operationId: introspect
      parameters:
      - description: Basic Authentication header (Base64-encoded apiKey:apiSecret).
          Required unless application.security.introspection.require-caller-auth is
          false.
        explode: false
        in: header
        name: Authorization
        required: false
        schema:
          type: string
        style: simple
      - description: Token to introspect
        explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      - description: Token type hint (unused; kept for RFC 7662 compatibility)
        explode: true
        in: query
        name: token_type_hint
        required: false
        schema:
          type: string
        style: form
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IntrospectionResponse'
          description: Introspection result
        "401":
          description: Caller credentials missing or invalid
      security:
      - basicAuth: []
      summary: Introspect an access token
      tags:
      - OAuth2
      x-accepts:
      - '*/*'
  /auth/merchants/api-keys:
    get:
      description: "Returns a summary of all API keys belonging to the authenticated\
        \ merchant, including status and usage metadata."
      operationId: listApiKeys
      parameters:
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiKeySummary'
          description: API keys retrieved successfully
        "401":
          description: Unauthorized
        "403":
          description: Forbidden – requires MERCHANT role with PASSWORD auth
      security:
      - bearerAuth: []
      summary: List all API keys
      tags:
      - Merchant API Keys
      x-accepts:
      - '*/*'
    post:
      description: Generates a new API key pair (apiKey and apiSecret) for the authenticated
        merchant. The apiSecret is only returned once at creation time and cannot
        be retrieved later.
      operationId: createApiKey
      parameters:
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
          description: API key created successfully
        "400":
          description: Invalid request body
        "401":
          description: Unauthorized
        "403":
          description: Forbidden – requires MERCHANT role with PASSWORD auth
      security:
      - bearerAuth: []
      summary: Create a new API key
      tags:
      - Merchant API Keys
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /auth/partners/merchants/{merchantId}/status:
    get:
      description: "Returns the onboarding status of a specific merchant, including\
        \ account status, email verification state, and creation date. The merchant\
        \ must belong to the authenticated partner."
      operationId: getPartnerMerchantStatus
      parameters:
      - description: Merchant identifier
        explode: false
        in: path
        name: merchantId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MerchantOnboardingStatus'
          description: Merchant status retrieved successfully
        "401":
          description: Unauthorized
        "403":
          description: Forbidden – merchant does not belong to this partner
        "404":
          description: Merchant not found
      security:
      - bearerAuth: []
      summary: Get merchant onboarding status
      tags:
      - Partner Merchants
      x-accepts:
      - '*/*'
  /auth/partners/merchants/{merchantId}/earnings:
    get:
      description: "Returns a page of the merchant's earnings (credit accruals, newest\
        \ first) for the detail-page Earnings tab. Proxied to partner-program; partner-scoped\
        \ (404 if not owned)."
      operationId: getPartnerMerchantEarnings
      parameters:
      - explode: false
        in: path
        name: merchantId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          type: integer
        style: form
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseListMerchantEarningRow'
          description: OK
      security:
      - bearerAuth: []
      summary: List a merchant's earnings
      tags:
      - Partner Merchants
      x-accepts:
      - '*/*'
  /auth/partners/merchants/{merchantId}/earnings/summary:
    get:
      description: Lifetime + pending earnings totals for the detail-page stat tiles.
        Proxied to partner-program; partner-scoped (404 if not owned).
      operationId: getPartnerMerchantEarningsSummary
      parameters:
      - explode: false
        in: path
        name: merchantId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: currency
        required: false
        schema:
          default: ILS
          type: string
        style: form
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MerchantEarningsSummary'
          description: OK
      security:
      - bearerAuth: []
      summary: Merchant earnings totals
      tags:
      - Partner Merchants
      x-accepts:
      - '*/*'
  /auth/partners/merchants/{merchantId}/deliveries:
    get:
      description: Returns a page of the merchant's deliveries (newest first) for
        the detail-page Deliveries tab. Proxied to delivery-hub with a service token;
        partner-scoped (404 if not owned).
      operationId: getPartnerMerchantDeliveries
      parameters:
      - explode: false
        in: path
        name: merchantId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          type: integer
        style: form
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseListMerchantDeliveryRow'
          description: OK
      security:
      - bearerAuth: []
      summary: List a merchant's deliveries
      tags:
      - Partner Merchants
      x-accepts:
      - '*/*'
  /auth/partners/merchants/stats:
    get:
      description: "Returns active-merchant statistics for the authenticated partner:\
        \ the current active-merchant count, the active count as of ~30 days ago (the\
        \ previous-period comparison base), and a 7-day cumulative series for trend\
        \ display."
      operationId: getPartnerMerchantStats
      parameters:
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MerchantStats'
          description: Statistics retrieved successfully
        "401":
          description: Unauthorized
        "404":
          description: Partner not found
      security:
      - bearerAuth: []
      summary: Get active-merchant statistics
      tags:
      - Partner Merchants
      x-accepts:
      - '*/*'
  /auth/partners/merchants/by-email:
    get:
      description: Looks up a merchant by their email address within the authenticated
        partner's scope. Returns the merchant summary if found and belongs to this
        partner.
      operationId: getPartnerMerchantByEmail
      parameters:
      - description: Merchant email address
        explode: true
        in: query
        name: email
        required: true
        schema:
          type: string
        style: form
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MerchantSummary'
          description: Merchant found
        "401":
          description: Unauthorized
        "404":
          description: Merchant not found for this partner
      security:
      - bearerAuth: []
      summary: Get merchant by email
      tags:
      - Partner Merchants
      x-accepts:
      - '*/*'
  /auth/merchants/api-keys/{id}:
    delete:
      description: Permanently revokes the specified API key. The key will no longer
        be usable for authentication.
      operationId: revokeApiKey
      parameters:
      - description: API key identifier
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Language preference for response content. Supported: en, he"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          default: en
          enum:
          - en
          - he
          type: string
        style: simple
      responses:
        "200":
          description: API key revoked successfully
        "401":
          description: Unauthorized
        "403":
          description: Forbidden – requires MERCHANT role with PASSWORD auth
        "404":
          description: API key not found
      security:
      - bearerAuth: []
      summary: Revoke an API key
      tags:
      - Merchant API Keys
      x-accepts:
      - application/json
components:
  schemas:
    MerchantUpdateRequest:
      description: Editable merchant profile fields; null fields are left unchanged
      example:
        businessEmail: businessEmail
        addressHe: addressHe
        lng: 6.027456183070403
        cityHe: cityHe
        nameHe: nameHe
        businessName: businessName
        cityEn: cityEn
        nameEn: nameEn
        businessPhone: businessPhone
        businessType: food
        addressEn: addressEn
        lat: 0.8008281904610115
      properties:
        nameHe:
          type: string
        nameEn:
          type: string
        businessName:
          type: string
        businessEmail:
          type: string
        businessPhone:
          type: string
        businessType:
          enum:
          - food
          - retail
          type: string
        addressHe:
          type: string
        addressEn:
          type: string
        cityHe:
          type: string
        cityEn:
          type: string
        lat:
          format: double
          type: number
        lng:
          format: double
          type: number
    MerchantDetail:
      description: Full merchant profile for the detail view
      example:
        businessEmail: businessEmail
        lastModifiedAt: 2000-01-23T04:56:07.000+00:00
        lng: 6.027456183070403
        cityHe: cityHe
        origin: SELF
        businessName: businessName
        nameEn: nameEn
        addressHe: addressHe
        createdAt: 2000-01-23T04:56:07.000+00:00
        ownerHe: ownerHe
        nameHe: nameHe
        referralCode: referralCode
        referrerUserId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        cityEn: cityEn
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        businessPhone: businessPhone
        partnerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        businessType: food
        addressEn: addressEn
        ownerEn: ownerEn
        email: email
        lat: 0.8008281904610115
        status: PENDING_ACTIVATION
      properties:
        id:
          description: Unique identifier of the merchant
          format: uuid
          type: string
        nameHe:
          description: Hebrew business name
          type: string
        nameEn:
          description: English business name
          type: string
        businessName:
          description: Legacy/canonical business name
          type: string
        ownerHe:
          description: Owner full name (Hebrew display)
          type: string
        ownerEn:
          description: Owner full name (English display)
          type: string
        email:
          description: Owner account email
          type: string
        businessEmail:
          description: Public-facing business email
          type: string
        businessPhone:
          description: Business phone
          type: string
        businessType:
          description: Business category
          enum:
          - food
          - retail
          type: string
        status:
          description: Account status (active/suspended/pending derived client-side)
          enum:
          - PENDING_ACTIVATION
          - PENDING_PASSWORD_SETUP
          - ACTIVE
          - SUSPENDED
          type: string
        origin:
          description: How the merchant was onboarded
          enum:
          - SELF
          - PARTNER_API
          - ADMIN
          - SSO
          type: string
        partnerId:
          description: "Owning partner id, if any"
          format: uuid
          type: string
        referralCode:
          description: Merchant referral code
          type: string
        referrerUserId:
