    SearchMerchantsRequest:
      description: |
        Advanced search request for a partner's merchants with filtering, sorting, and pagination.
        **Query Fields** (full-text, case-insensitive LIKE): `nameEn`, `nameHe`, `businessName`, and the owner's account email.
        **Available Filter/Sort Fields:**
        - `businessType` (food | retail, sortable)
        - `origin` (SELF | PARTNER_API | ADMIN, sortable)
        - `businessName` (String, sortable)
        - `createdDate` (Instant, sortable)

        Note: account `status` lives on the linked user, so it isn't a mapped field here.
        Status *filtering* is applied server-side as a join predicate in MerchantQueryService;
        status *sorting* is not a server-side field and stays client-side.
      example:
        pagination:
          pageNumber: 1
          itemsPerPage: 10
        query: John
        filters:
          key:
          - name: email
            logic: EQ
            value: ""
          - name: email
            logic: EQ
            value: ""
        sort:
        - fieldName: createdDate
          direction: DESC
        - fieldName: createdDate
          direction: DESC
      properties:
        query:
          description: Full-text search query string. Matches against predefined query
            fields using case-insensitive LIKE.
          example: John
          type: string
        filters:
          additionalProperties:
            items:
              $ref: '#/components/schemas/Filter'
          description: Filter groups with AND/OR logic. Each group contains a list
            of filter criteria that are combined using the specified operator.
        sort:
          description: Sort criteria applied in order. Only sortable fields are accepted.
          items:
            $ref: '#/components/schemas/SortField'
          type: array
        pagination:
          $ref: '#/components/schemas/Pagination'
    SortField:
      description: Sort criteria for ordering results
      example:
        fieldName: createdDate
        direction: DESC
      properties:
        fieldName:
          description: Field name to sort by. Must be a sortable field.
          example: createdDate
          type: string
        direction:
          default: asc
          description: Sort direction (case-insensitive)
          enum:
          - ASC
          - asc
          - DESC
          - desc
          example: DESC
          type: string
      required:
      - fieldName
